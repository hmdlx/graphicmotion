<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Black Friday Premium – 9:16</title>
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../assets/fonts/poppins/poppins-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 500; src: url(../../assets/fonts/poppins/poppins-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../assets/fonts/poppins/poppins-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(../../assets/fonts/poppins/poppins-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 800; src: url(../../assets/fonts/poppins/poppins-latin-800-normal.woff2) format("woff2"); }

  /* Produktseiten-Look: Schwarz, viel Raum, ruhige Typo – in Home-Deluxe-CI (Poppins, Navy, Weiß, Grau, eckig) */
  :root {
    --navy: #0e2234;
    --navy-2: #1c3a54;
    --grey: #8a929a;          /* Fließtext, Eyebrows */
    --grey-2: #5d656d;
    --line: rgba(255, 255, 255, .16);
    --card: #0c1621;          /* Kacheln: Schwarz mit Navy-Stich */
    --m: 80px;                /* Seitenrand */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; }

  #page { position: absolute; left: 0; top: 0; width: 1080px; }
  section { position: relative; width: 1080px; }
  .rv { will-change: transform, opacity; }
  b { font-weight: 600; color: #fff; }

  /* Globale Navigation (scrollt weg) */
  #gnav { height: 112px; display: flex; align-items: center; padding: 0 var(--m); }
  #gnav img { width: 236px; height: auto; display: block; opacity: .92; }
  #gnav .icons { margin-left: auto; display: flex; gap: 52px; }
  #gnav svg { display: block; }
  .lnav-slot { height: 124px; }

  /* Lokale Navigation (bleibt oben stehen) */
  #lnav { position: absolute; left: 0; width: 1080px; height: 124px; display: flex; align-items: center; padding: 0 var(--m);
          background: rgba(14, 34, 52, .72); backdrop-filter: blur(24px) saturate(1.4); border-bottom: 1px solid var(--line); z-index: 5; }
  #lnav .title { font-weight: 600; font-size: 44px; letter-spacing: -.01em; }
  #lnav .btns { margin-left: auto; display: flex; gap: 18px; }
  .btn { font-weight: 500; font-size: 30px; line-height: 1; padding: 18px 28px 16px; white-space: nowrap; }
  .btn.ghost { border: 2px solid rgba(255, 255, 255, .55); padding: 16px 26px 14px; }
  .btn.solid { background: #fff; color: var(--navy); font-weight: 600; }

  /* Hero */
  #hero { height: 1684px; text-align: center; overflow: hidden; }
  #hero .name { padding-top: 150px; font-weight: 600; font-size: 56px; letter-spacing: -.01em; }
  #chrome { position: absolute; left: 0; top: 330px; width: 1080px; text-align: center; font-weight: 800; font-size: 360px; line-height: 1; letter-spacing: -.04em; }
  #chrome span { display: inline-block; }
  .chrome { background: linear-gradient(180deg, #fff 0%, #dfe3e7 16%, #858d96 38%, #f4f6f8 50%, #8f969e 63%, #eef1f3 84%, #9ca3aa 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sheen { position: absolute; left: 0; top: 0; width: 100%; color: transparent;
           background: linear-gradient(100deg, transparent 40%, rgba(255, 255, 255, .95) 50%, transparent 60%); background-size: 300% 100%;
           -webkit-background-clip: text; background-clip: text; }
  #hero .glow { position: absolute; left: 50%; top: 800px; width: 1100px; height: 520px; margin-left: -550px; border-radius: 50%;
                background: radial-gradient(ellipse at center, rgba(28, 58, 84, .95) 0%, rgba(14, 34, 52, .55) 40%, transparent 70%); }
  #hero .prod { position: absolute; left: 50%; top: 600px; width: 820px; margin-left: -410px; }
  #hero .prod img { display: block; width: 100%; height: auto; }
  #hero .shadow { position: absolute; left: 50%; top: 1310px; width: 760px; height: 70px; margin-left: -380px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0, 0, 0, .9), transparent 70%); }
  #hero .sub { position: absolute; left: 0; top: 1500px; width: 1080px; font-weight: 400; font-size: 40px; color: var(--grey); }

  /* Typo-Bausteine */
  .eyebrow { font-weight: 600; font-size: 40px; color: var(--grey); letter-spacing: -.005em; }
  .h2 { font-weight: 600; font-size: 104px; line-height: 1.06; letter-spacing: -.035em; }
  .body { font-weight: 400; font-size: 44px; line-height: 1.48; color: var(--grey); letter-spacing: -.005em; }
  .link { font-weight: 500; font-size: 40px; color: #fff; }
  .link i { font-style: normal; margin-left: 8px; }
  .pad { padding: 0 var(--m); }

  /* Highlights */
  #hl { padding-top: 160px; }
  .car { position: relative; margin-top: 70px; height: 1180px; overflow: hidden; }
  .track { position: absolute; left: var(--m); top: 0; display: flex; gap: 28px; }
  .hcard { position: relative; width: 920px; height: 1180px; overflow: hidden; background: var(--card); }
  .hcard img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .hcard .fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .72) 0%, rgba(0, 0, 0, .25) 38%, transparent 55%); }
  .hcard .cap { position: absolute; left: 0; top: 96px; width: 100%; padding: 0 70px; text-align: center; font-weight: 500; font-size: 46px; line-height: 1.3; letter-spacing: -.01em; color: rgba(255, 255, 255, .85); }
  .hcard .cap .px { display: block; margin-top: 8px; font-weight: 600; font-size: 96px; line-height: 1.05; letter-spacing: -.035em; color: #fff; font-variant-numeric: tabular-nums; }
  .hcard .cap s { display: block; margin-top: 6px; font-weight: 400; font-size: 40px; color: rgba(255, 255, 255, .6); }
  .ctrl { margin-top: 44px; display: flex; justify-content: center; gap: 22px; }
  .dots { display: flex; align-items: center; gap: 20px; padding: 0 34px; height: 84px; background: #1a222b; }
  .dot { position: relative; width: 16px; height: 16px; background: rgba(255, 255, 255, .45); overflow: hidden; }
  .dot i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; }
  .pause { width: 84px; height: 84px; background: #1a222b; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pause i { width: 8px; height: 30px; background: #fff; }


  /* Vollformat-Bild */
  #full { margin-top: 260px; height: 1520px; overflow: hidden; }
  #full img { position: absolute; left: 0; top: 0; width: 1080px; height: 1520px; object-fit: cover; transform-origin: 50% 50%; }
  #full-cap { padding: 56px var(--m) 0; text-align: center; }
  #full-cap .nm { font-weight: 500; font-size: 44px; color: var(--grey); }
  #full-cap .pp { margin-top: 6px; display: flex; justify-content: center; align-items: baseline; gap: 26px; }
  #full-cap .pp b { font-weight: 600; font-size: 104px; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  #full-cap .pp s { font-weight: 400; font-size: 44px; color: var(--grey-2); }

  /* Spa */
  #spa { padding-top: 420px; }
  .spa-card { position: relative; margin: 70px var(--m) 0; height: 860px; overflow: hidden;
              background: radial-gradient(ellipse 80% 55% at 50% 72%, #1c3a54 0%, #0e2234 42%, #050a10 100%); }
  .spa-card img { position: absolute; left: 50%; top: 80px; width: 460px; margin-left: -230px; }
  .spa-card .floor { position: absolute; left: 50%; top: 790px; width: 640px; height: 60px; margin-left: -320px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0, 0, 0, .85), transparent 70%); }
  .price { padding: 56px var(--m) 0; text-align: center; }
  .price .nm { font-weight: 500; font-size: 40px; color: var(--grey); }
  .price .old { position: relative; display: inline-block; margin-top: 18px; font-weight: 500; font-size: 56px; color: var(--grey-2); font-variant-numeric: tabular-nums; }
  .price .old::after { content: ""; position: absolute; left: -4px; right: -4px; top: 54%; height: 4px; background: var(--grey); transform: scaleX(var(--s, 0)); transform-origin: 0 50%; }
  .price .now { display: block; font-weight: 600; font-size: 168px; line-height: 1.02; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }


  /* Ende */
  #end { padding-top: 700px; height: 2600px; text-align: center; }
  #end .logo { margin: 0 auto; width: 560px; }
  #end .logo img { width: 100%; height: auto; display: block; }
  #end .claim { margin-top: 70px; font-weight: 600; font-size: 84px; letter-spacing: -.03em; }
  #end .ctas { margin-top: 90px; display: flex; justify-content: center; gap: 22px; }
  #end .ctas .btn { font-size: 38px; padding: 30px 46px 28px; }
  #end .ctas .btn.ghost { padding: 28px 44px 26px; }
  #end .url { margin-top: 60px; font-weight: 400; font-size: 36px; color: var(--grey); letter-spacing: .02em; }
</style>
</head>
<body>
<div id="stage">
  <div id="page">
    <header id="gnav">
      <img src="../../assets/logo/homedeluxe-logo-white.svg" alt="Home Deluxe">
      <div class="icons">
        <svg width="44" height="44" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M15.8 15.8L22 22" stroke="#fff" stroke-width="1.8"/></svg>
        <svg width="44" height="44" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 13H6.2z" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="#fff" stroke-width="1.7"/></svg>
      </div>
    </header>
    <div class="lnav-slot"></div>

    <section id="hero">
      <div class="name rv" id="r-name">Black Friday</div>
      <div id="chrome" class="rv"><span class="chrome">-25%</span><span class="sheen">-25%</span></div>
      <div class="glow rv" id="r-glow"></div>
      <div class="shadow rv" id="r-shadow"></div>
      <div class="prod rv" id="r-prod"><img src="source/cut_02.png" alt=""></div>
    </section>

    <section id="hl">
      <div class="pad"><div class="h2 rv" id="r-hl">Die Highlights.</div></div>
      <div class="car rv" id="r-car"><div class="track" id="track"></div></div>
      <div class="ctrl rv" id="r-ctrl">
        <div class="dots"><div class="dot"><i></i></div><div class="dot"><i></i></div><div class="dot"><i></i></div></div>
        <div class="pause"><i></i><i></i></div>
      </div>
    </section>

    <section id="full"><img id="full-img" src="source/amb_14.jpg" alt=""></section>
    <div id="full-cap" class="rv"><div class="nm">Whirlpool SUNSHINE</div><div class="pp"><b id="full-px"></b><s id="full-old"></s></div></div>

    <section id="spa">
      <div class="pad"><div class="h2 rv" id="r-spa-h">Dein Spa.</div></div>
      <div class="spa-card rv" id="r-spa-card"><div class="floor"></div><img id="spa-img" src="source/cut_15.png" alt=""></div>
      <div class="price">
        <div class="nm rv" id="r-spa-nm">Kombisauna EVEREST M</div>
        <div class="old rv" id="spa-old"></div>
        <div class="now rv" id="spa-now"></div>
      </div>
    </section>

    <section id="end">
      <div class="logo rv" id="r-end-logo"><img src="../../assets/logo/homedeluxe-logo-white.svg" alt="Home Deluxe"></div>
      <div class="claim rv" id="r-end-claim">-25 % auf alles.</div>
      <div class="ctas rv" id="r-end-cta"><div class="btn solid">Jetzt entdecken</div></div>
      <div class="url rv" id="r-end-url">homedeluxe.de</div>
    </section>
  </div>

  <div id="lnav">
    <div class="title">Black Friday</div>
    <div class="btns"><div class="btn ghost">Entdecken</div><div class="btn solid">Kaufen</div></div>
  </div>
</div>
<script src="../shop-3d/products.js"></script>
<script src="composition.js"></script>
</body>
</html>
