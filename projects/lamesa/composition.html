<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LAMESA – Reel 9:16</title>
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../assets/fonts/poppins/poppins-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 500; src: url(../../assets/fonts/poppins/poppins-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../assets/fonts/poppins/poppins-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(../../assets/fonts/poppins/poppins-latin-700-normal.woff2) format("woff2"); }

  /* Home Deluxe CI: Navy + Weiß, eckige Ecken, Poppins. Endsequenz auf #fefefe. */
  :root {
    --navy: #0f2334;
    --paper: #fefefe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  body { font-family: Poppins, sans-serif; color: var(--navy); -webkit-font-smoothing: antialiased; }

  #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  #footage { position: absolute; inset: 0; overflow: hidden; }
  #footage img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
  #dim { position: absolute; inset: 0; background: var(--navy); }

  /* Paper plate: rises over the last shot and carries the colour scene. */
  #plate { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--paper);
           box-shadow: 0 -30px 80px rgba(15, 35, 52, .16); }

  .ln { display: block; overflow: hidden; padding-bottom: .08em; margin-bottom: -.08em; }
  .ln > span { display: inline-block; will-change: transform; }

  #headline { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
  #headline .pre { font-weight: 400; font-size: 52px; line-height: 1.1; letter-spacing: .02em; }
  #headline .main { font-weight: 700; font-size: 118px; line-height: 1.04; letter-spacing: -.02em; margin-top: 4px; }
  #rule { position: absolute; left: 500px; top: 572px; width: 80px; height: 3px; background: var(--navy); }

  /* Freisteller: white background lifted to pure white, then multiplied onto the paper. */
  .product { position: absolute; overflow: hidden; mix-blend-mode: multiply; }
  .product img { position: absolute; display: block; filter: brightness(1.02); }

  /* Logo outro */
  #logo { position: absolute; left: 200px; top: 924px; width: 680px; height: auto; overflow: visible; color: var(--navy); }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img alt=""></div>
  <div id="dim"></div>

  <div id="plate">
    <div id="headline">
      <div class="pre"><span class="ln"><span>Erhältlich in</span></span></div>
      <div class="main"><span class="ln"><span>zwei Farben</span></span></div>
    </div>
    <div id="rule"></div>
    <div class="product" id="p-light"><img src="source/lamesa_freisteller_hell.jpg" alt=""></div>
    <div class="product" id="p-dark"><img src="source/lamesa_freisteller_schwarz.jpg" alt=""></div>

    <!-- Home Deluxe logo (assets/logo), split into icon / HOME letters / DELUXE for the resolve. -->
    <svg id="logo" viewBox="0 0 257.065 26.426" role="img" aria-label="Home Deluxe">
      <defs>
        <!-- Soft-edged wipes: solid part + feathered leading edge, driven by composition.js. -->
        <linearGradient id="feather"><stop offset="0" stop-color="#fff" /><stop offset="1" stop-color="#000" /></linearGradient>
        <mask id="wipe-ome" maskUnits="userSpaceOnUse" x="0" y="-4" width="260" height="36">
          <rect class="solid" x="30.8" y="-4" width="0" height="36" fill="#fff" /><rect class="soft" x="30.8" y="-4" width="0" height="36" fill="url(#feather)" />
        </mask>
        <mask id="wipe-deluxe" maskUnits="userSpaceOnUse" x="0" y="-4" width="260" height="36">
          <rect class="solid" x="117" y="-4" width="0" height="36" fill="#fff" /><rect class="soft" x="117" y="-4" width="0" height="36" fill="url(#feather)" />
        </mask>
      </defs>
      <g id="logo-shift" fill="currentColor">
        <g id="logo-icon">
          <g transform="translate(0 0.643)">
            <path d="M11.851,97.569h-9v-7.2H0Q7.673,84.548,15.347,78.7c5.116,3.882,10.231,7.789,15.347,11.671H27.84v7.2h-9c.206-2.082.257-4.164.257-6.272s-1.594-2.005-3.779-2.057c-2.159.051-3.779.463-3.779,2.057C11.594,93.4,11.645,95.512,11.851,97.569Z" transform="translate(0 -72.428)"></path>

            <path d="M11.1,54.3h9v6.144l-9,6.838Z" transform="translate(-8.247 -54.3)"></path>
          </g>
        </g>
        <g mask="url(#wipe-ome)">
          <g id="logo-ome">
            <path d="M376.918,73.94V69.364H388.1V64.043H376.918V59.8h12.7V54.3H369.9V79.441h20.18v-5.5Z" transform="translate(-274.812 -53.657)"></path>
            <path d="M272.428,79.441,272.377,54.3h-5.861l-8.637,14.524L249.061,54.3H243.2V79.441h6.581V66.485l6.427,10.488h3.162l6.452-10.848.077,13.316Z" transform="translate(-180.682 -53.657)"></path>
            <path d="M134.613,78.226c8.123,0,14.113-5.578,14.113-13.213S142.736,51.8,134.613,51.8,120.5,57.378,120.5,65.013s5.99,13.213,14.113,13.213m0-5.964c-3.856,0-6.864-2.853-6.864-7.249s3.008-7.249,6.864-7.249,6.864,2.853,6.864,7.249-3.033,7.249-6.864,7.249" transform="translate(-89.524 -51.8)"></path>
          </g>
        </g>
        <g mask="url(#wipe-deluxe)">
          <g id="logo-deluxe">
            <g transform="translate(124.52 0.549)">
              <path d="M932.4,55V80.147h17.341V78.492h-15.52v-10.3h13.39v-1.63h-13.39V56.656H949.2V55Z" transform="translate(-817.196 -55)"></path>
              <path d="M860.32,80.147l-9.594-13.014L859.653,55H857.6l-7.927,10.814L841.722,55h-2.155l8.927,12.186L838.9,80.147h2.129L849.6,68.505l8.594,11.642Z" transform="translate(-747.68 -55)"></path>
              <path d="M760,80.328c6.208,0,10.03-3.674,10.03-10.866V55h-1.822V69.411c0,6.287-2.976,9.236-8.183,9.236s-8.209-2.949-8.209-9.236V55H750V69.488c0,7.192,3.8,10.84,10,10.84" transform="translate(-681.585 -55)"></path>
              <path d="M677.9,80.147h16.315V78.492H679.721V55H677.9Z" transform="translate(-627.981 -55)"></path>
              <path d="M593.4,78.492v-10.3h13.237v-1.63H593.4V56.656h14.8V55H591.6V80.147h17.136V78.492Z" transform="translate(-563.819 -55)"></path>
              <path d="M483.3,80.147h9.9c7.952,0,13.314-5.252,13.314-12.574S501.154,55,493.2,55h-9.9V80.147Zm1.821-1.656V56.656h7.952c7.08,0,11.62,4.528,11.62,10.918s-4.54,10.918-11.62,10.918Z" transform="translate(-483.3 -55)"></path>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </div>
</div>

<script src="composition.js"></script>
</body>
</html>
