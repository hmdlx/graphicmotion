<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Black Friday Vista</title>
<style>
  @font-face { font-family: "OS"; src: url(../../assets/fonts/open-sans/open-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "OS"; src: url(../../assets/fonts/open-sans/open-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: "OS"; src: url(../../assets/fonts/open-sans/open-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: "OS"; src: url(../../assets/fonts/open-sans/open-sans-latin-800-normal.woff2) format("woff2"); font-weight: 800; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02050a; }
  body { font-family: "OS", "Segoe UI", sans-serif; }

  /* ---------- Desktop: Vista-Aurora, für Black Friday abgedunkelt ---------- */
  .desk {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(120% 70% at 50% 110%, #0e2234 0%, rgba(14,34,52,0) 60%),
      radial-gradient(90% 60% at 15% 0%, #071a2c 0%, rgba(7,26,44,0) 70%),
      #02050a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ribbon {
    position: absolute; border-radius: 50%;
    border: 0 solid transparent;
    filter: blur(1.5px);
  }
  .r1 { width: 2600px; height: 1200px; left: -1100px; top: calc(50% - 330px);
        border-top: 6px solid rgba(150,220,255,.9);
        box-shadow: 0 -22px 70px -8px rgba(60,170,255,.7), inset 0 40px 110px -30px rgba(60,170,255,.55);
        transform: rotate(-24deg); }
  .r2 { width: 2400px; height: 1000px; left: -900px; top: calc(50% - 180px);
        border-top: 4px solid rgba(120,255,210,.75);
        box-shadow: 0 -16px 60px -10px rgba(40,230,180,.6), inset 0 34px 90px -30px rgba(40,230,180,.45);
        transform: rotate(-17deg); }
  .r3 { width: 2800px; height: 1400px; left: -1300px; top: calc(50% - 520px);
        border-top: 2px solid rgba(210,240,255,.55);
        box-shadow: inset 0 60px 160px -50px rgba(80,140,255,.45);
        transform: rotate(-30deg); }
  .glow { position: absolute; width: 900px; height: 500px; border-radius: 50%;
          left: 50%; top: 50%; transform: translate(-50%, -50%);
          background: radial-gradient(closest-side, rgba(70,170,255,.4), rgba(70,170,255,0));
          filter: blur(30px); }

  /* ---------- Aero-Fenster ---------- */
  .win {
    position: relative; z-index: 2; width: 940px;
    padding: 0 16px 16px;
    border-radius: 18px 18px 14px 14px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.08) 7%, rgba(255,255,255,.02) 40%, rgba(255,255,255,.06) 100%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0) 0 120px, rgba(255,255,255,.07) 120px 160px, rgba(255,255,255,0) 160px 260px),
      rgba(16,30,48,.62);
    backdrop-filter: blur(10px) saturate(140%);
    border: 2px solid rgba(0,0,0,.85);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.45),
      0 30px 80px rgba(0,0,0,.75),
      0 0 60px rgba(80,170,255,.18);
  }
  .bar { height: 74px; display: flex; align-items: center; justify-content: space-between; }
  .title { display: flex; align-items: center; gap: 14px; padding-left: 8px;
           color: #fff; font-size: 30px; font-weight: 400;
           text-shadow: 0 0 14px rgba(255,255,255,.9), 0 0 2px rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,.6);
           /* Vista legt einen hellen Hof hinter den Fenstertitel */ }
  .title .ico { width: 34px; height: 34px; border-radius: 50%;
                background: radial-gradient(circle at 50% 30%, #6a7d92 0%, #1b2532 55%, #000 100%);
                box-shadow: 0 0 0 2px rgba(255,255,255,.7), 0 0 10px rgba(100,190,255,.8);
                color: #fff; font-size: 20px; font-weight: 800; line-height: 34px; text-align: center;
                text-shadow: none; }
  .caps { display: flex; align-self: flex-start; margin-right: 6px;
          border: 2px solid rgba(0,0,0,.75); border-top: 0; border-radius: 0 0 10px 10px; overflow: hidden;
          box-shadow: 0 0 0 1px rgba(255,255,255,.45), 0 4px 10px rgba(0,0,0,.4); }
  .cap { width: 64px; height: 42px; position: relative;
         background: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.18) 48%, rgba(0,0,0,.25) 52%, rgba(255,255,255,.12) 100%);
         border-right: 1px solid rgba(0,0,0,.6); }
  .cap.min::after { content: ""; position: absolute; left: 22px; right: 22px; bottom: 13px; height: 5px;
                    background: #fff; border: 1px solid rgba(0,0,0,.6); }
  .cap.max::after { content: ""; position: absolute; left: 22px; right: 22px; top: 11px; bottom: 11px;
                    border: 2px solid #fff; border-top-width: 5px; box-shadow: 0 0 0 1px rgba(0,0,0,.55); }
  .cap.close { width: 104px; border-right: 0;
               background: linear-gradient(180deg, #f1b1a1 0%, #dd7a63 46%, #c3401f 52%, #d4613d 85%, #f19a73 100%); }
  .cap.close::before, .cap.close::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 30px; height: 6px; background: #fff;
    border-radius: 1px; box-shadow: 0 0 0 1px rgba(80,20,10,.55);
  }
  .cap.close::before { transform: translate(-50%,-50%) rotate(45deg); }
  .cap.close::after  { transform: translate(-50%,-50%) rotate(-45deg); }

  /* ---------- Client-Bereich ---------- */
  .client { background: #fff; border: 2px solid rgba(0,0,0,.55); border-radius: 2px;
            box-shadow: 0 0 0 2px rgba(255,255,255,.35); overflow: hidden; }
  .main { padding: 46px 52px 38px; display: grid; grid-template-columns: 170px 1fr; column-gap: 36px; }
  .orb { width: 170px; height: 170px; border-radius: 50%; position: relative; margin-top: 10px;
         background: radial-gradient(circle at 50% 75%, #3aa8ff 0%, #0d4f9a 30%, #06182e 62%, #000 100%);
         box-shadow: 0 0 0 4px #1d2733, 0 0 0 7px rgba(170,215,255,.9), 0 8px 24px rgba(0,60,140,.55), 0 0 40px rgba(60,160,255,.45);
         display: flex; align-items: center; justify-content: center;
         color: #fff; font-size: 104px; font-weight: 800; letter-spacing: -2px;
         text-shadow: 0 0 18px rgba(120,200,255,.95), 0 3px 4px rgba(0,0,0,.6); }
  .orb::before { /* Glanzkappe */
         content: ""; position: absolute; left: 12%; right: 12%; top: 5%; height: 46%; border-radius: 50%;
         background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.05)); }
  .orb span { position: relative; top: -4px; }

  .eyebrow { font-size: 30px; font-weight: 700; color: #555; letter-spacing: .14em; text-transform: uppercase; }
  .big { font-size: 170px; line-height: .96; font-weight: 800; color: #003399; letter-spacing: -5px; margin: 6px 0 8px -6px;
         white-space: nowrap; }
  .big small { font-size: .9em; }
  .sub { font-size: 44px; line-height: 1.2; font-weight: 600; color: #1e1e1e; }

  .prog { padding: 0 52px 42px; }
  .prog .lbl { font-size: 28px; color: #333; margin-bottom: 12px; }
  .track { height: 40px; border: 2px solid #8f8f8f; border-radius: 4px; padding: 3px;
           background: linear-gradient(180deg, #e9e9e9, #f8f8f8); box-shadow: inset 0 1px 3px rgba(0,0,0,.15); }
  .fill { height: 100%; width: 78%; border-radius: 2px; position: relative; overflow: hidden;
          background: linear-gradient(180deg, #dcffdc 0%, #8ef08e 18%, #2fd22f 50%, #03b503 52%, #22d022 85%, #6be86b 100%);
          box-shadow: inset 0 0 0 1px rgba(0,110,0,.35); }
  .fill::after { /* der wandernde Lichtschein der Vista-Fortschrittsanzeige */
          content: ""; position: absolute; top: 0; bottom: 0; width: 240px; left: 48%;
          background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); }
  .prog .meta { font-size: 24px; color: #6d6d6d; margin-top: 10px; }

  .foot { background: #f0f0f0; border-top: 2px solid #dfdfdf; padding: 26px 52px;
          display: flex; align-items: center; justify-content: space-between; }
  .link { font-size: 30px; color: #0066cc; text-decoration: underline; }
  .btns { display: flex; gap: 18px; }
  .btn { min-width: 228px; height: 70px; padding: 0 28px; border-radius: 7px; font-size: 30px; color: #000;
         display: flex; align-items: center; justify-content: center; font-family: inherit;
         border: 2px solid #707070;
         background: linear-gradient(180deg, #f6f6f6 0%, #ebebeb 49%, #dddddd 51%, #cfcfcf 100%);
         box-shadow: inset 0 0 0 2px rgba(255,255,255,.85); }
  .btn.def { border-color: #3c7fb1; font-weight: 600;
             background: linear-gradient(180deg, #eaf6fd 0%, #d9f0fc 49%, #bee6fd 51%, #a7d9f5 100%);
             box-shadow: inset 0 0 0 2px rgba(255,255,255,.9), 0 0 14px rgba(60,160,230,.55); }
  .btn.off { color: #8a8a8a; border-color: #adb2b5; background: #f4f4f4; box-shadow: none; }

  .logo { position: relative; z-index: 2; width: 360px; margin-top: 64px; opacity: .95; }

  /* ---------- Formate ---------- */
  body[data-f="1x1"] .win  { transform: scale(.86); transform-origin: 50% 50%; margin: -64px 0 -56px; }
  body[data-f="1x1"] .logo { margin-top: 18px; width: 300px; }
  body[data-f="9x16"] .win { margin-top: 40px; }
  body[data-f="9x16"] .logo { margin-top: 90px; width: 400px; }
</style>
</head>
<body>
<div class="desk">
  <div class="glow"></div>
  <div class="ribbon r3"></div>
  <div class="ribbon r1"></div>
  <div class="ribbon r2"></div>

  <div class="win">
    <div class="bar">
      <div class="title"><div class="ico">%</div>Black Friday</div>
      <div class="caps"><div class="cap min"></div><div class="cap max"></div><div class="cap close"></div></div>
    </div>
    <div class="client">
      <div class="main">
        <div class="orb"><span>%</span></div>
        <div>
          <div class="eyebrow">Black Friday Deal</div>
          <div class="big">−30<small>&#8239;%</small></div>
          <div class="sub">extra auf bereits<br>reduzierte Artikel</div>
        </div>
      </div>
      <div class="prog">
        <div class="lbl">Black Friday wird installiert …</div>
        <div class="track"><div class="fill"></div></div>
        <div class="meta">Verbleibende Zeit: nicht mehr lange</div>
      </div>
      <div class="foot">
        <span class="link">homedeluxe.de/sale</span>
        <div class="btns"><div class="btn def">Jetzt sparen</div><div class="btn off">Abbrechen</div></div>
      </div>
    </div>
  </div>

  <img class="logo" src="../../assets/logo/homedeluxe-logo-white.svg" alt="Home Deluxe">
</div>
<script>
  document.body.dataset.f = new URLSearchParams(location.search).get('f') || '4x5';
  window.READY = document.fonts.ready.then(() => Promise.all(
    [...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))));
</script>
</body>
</html>
