<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Black Friday – Produkt-Einblendungen</title>
<style>
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../assets/fonts/poppins/poppins-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(../../assets/fonts/poppins/poppins-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 800; src: url(../../assets/fonts/poppins/poppins-latin-800-normal.woff2) format("woff2"); }

  /* Home Deluxe CI: Navy + Weiß + Grautöne, eckige Ecken, Poppins.
     Transparente Ebene, die build.py über das Video legt. */
  :root { --navy: #0e2234; --grey: #aab7c4; --glow: rgba(205, 225, 255, .55); }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: transparent; }
  body { font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  .block { position: absolute; width: 760px; height: 560px; display: none; }
  .clip { position: absolute; inset: -60px -60px -60px 0; }

  /* Lichtlinien wie im Film: dünn, weiß, mit Glow */
  .hline { position: absolute; left: -150px; top: 0; height: 2px; width: 910px; background: #fff;
           box-shadow: 0 0 10px 1px var(--glow), 0 0 26px 2px rgba(150, 190, 255, .35); transform-origin: 0 50%; }
  .hline .head { position: absolute; right: -2px; top: -5px; width: 60px; height: 12px;
           background: radial-gradient(closest-side, #fff, rgba(255, 255, 255, 0)); }
  .node { position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; background: #fff; box-shadow: 0 0 12px 2px var(--glow); }
  .vline { position: absolute; left: 0; top: 0; width: 2px; height: 560px; background: linear-gradient(#fff, rgba(255, 255, 255, .15));
           box-shadow: 0 0 10px 1px var(--glow); transform-origin: 50% 0; }

  .mask { position: absolute; left: 34px; overflow: hidden; }
  .mask > div { will-change: transform; }
  .eyebrow { top: 32px; height: 48px; }
  .eyebrow > div { font-weight: 600; font-size: 32px; line-height: 48px; letter-spacing: .3em; color: rgba(233, 238, 244, .9); white-space: nowrap; }
  .title { top: 80px; height: 148px; }
  .title > div { font-weight: 800; font-size: 130px; line-height: 148px; letter-spacing: -.012em; white-space: nowrap;
                 text-shadow: 0 0 24px rgba(200, 222, 255, .35); }

  .row { position: absolute; left: 36px; top: 254px; height: 84px; display: flex; align-items: center; gap: 26px; }
  .badge { background: #fff; color: var(--navy); font-weight: 800; font-size: 56px; line-height: 1; padding: 14px 20px 11px;
           box-shadow: 0 0 28px 4px rgba(200, 222, 255, .35); transform-origin: 50% 50%; }
  .old { position: relative; font-weight: 700; font-size: 68px; line-height: 84px; color: var(--grey); white-space: nowrap; }
  .old .strike { position: absolute; left: -8px; right: -8px; top: 50%; height: 6px; margin-top: -3px; background: #fff;
                 box-shadow: 0 0 12px 2px var(--glow); transform: rotate(-7deg) scaleX(0); transform-origin: 0 50%; }

  .new { position: absolute; left: 28px; top: 340px; height: 220px; white-space: nowrap; transform-origin: 0 60%; }
  .new .num { font-weight: 800; font-size: 214px; line-height: 220px; letter-spacing: -.02em; display: inline-block;
              text-shadow: 0 0 34px rgba(200, 222, 255, .45); }
  .new .eur { font-weight: 700; font-size: 112px; line-height: 1; display: inline-block; vertical-align: top; margin: 38px 0 0 14px; }
  .scan { position: absolute; top: -20px; width: 10px; height: 260px; background: #fff; display: none;
          box-shadow: 0 0 22px 6px rgba(220, 235, 255, .9), 0 0 70px 18px rgba(150, 190, 255, .45); }

  /* Kante, die die Grafik beim Abgang wegwischt */
  .edge { position: absolute; top: -60px; width: 6px; height: 680px; background: #fff; display: none;
          box-shadow: 0 0 18px 5px rgba(220, 235, 255, .85), 0 0 60px 14px rgba(150, 190, 255, .4); }
  /* Fortsetzung des Lichtstrahls aus dem Film (Whirlpool), läuft über den Rand hinaus */
  #beam { position: absolute; top: 0; width: 16px; height: 1440px; margin-left: -8px; background: #fff; display: none;
          box-shadow: 0 0 26px 8px rgba(225, 238, 255, .9), 0 0 120px 40px rgba(150, 190, 255, .35); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="beam"></div>
<template id="tpl">
  <div class="block">
    <div class="clip">
      <div class="inner" style="position:absolute;left:0;top:60px;width:760px;height:560px">
        <div class="hline"><div class="head"></div></div>
        <div class="node"></div>
        <div class="vline"></div>
        <div class="mask eyebrow"><div></div></div>
        <div class="mask title"><div></div></div>
        <div class="row">
          <div class="badge">-25%</div>
          <div class="old"><span></span><div class="strike"></div></div>
        </div>
        <div class="new"><span class="num"></span><span class="eur">€</span><div class="scan"></div></div>
      </div>
    </div>
    <div class="edge"></div>
  </div>
</template>
<script src="overlay.js"></script>
</body>
</html>
