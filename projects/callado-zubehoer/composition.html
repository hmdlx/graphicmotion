<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>CALLADO Zubehör – Intro 16:9</title>
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../assets/fonts/poppins/poppins-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../assets/fonts/poppins/poppins-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(../../assets/fonts/poppins/poppins-latin-700-normal.woff2) format("woff2"); }

  /* Typografie wie im CALLADO-Film: Kicker in gesperrten Versalien, Zeile in Poppins Bold wie der
     Claim der End-Szene („Alles für deinen CALLADO.“), Position der Kapiteltitel (Rand 150 px,
     Kicker auf 600 px) über dem dunklen Zaun. Bild im Letterbox-Format der Nachtszenen (138–941 px). */
  :root { --margin: 150px; }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: Poppins, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #footage { position: absolute; left: 0; top: 138px; width: 1920px; height: 804px; overflow: hidden; }
  #footage img { position: absolute; left: 0; top: 50%; width: 1920px; height: auto; display: block; transform-origin: 50% 50%; }
  /* Leichte Abdunklung unten links, damit die Zeilen auch über dem hellen Boden stehen. */
  #grade { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 0% 92%, rgba(0, 0, 0, .5) 0%, rgba(0, 0, 0, 0) 100%); }

  .ln { display: block; overflow: hidden; padding-bottom: .08em; margin-bottom: -.08em; }
  .ln > span { display: inline-block; will-change: transform; }
  .beat { position: absolute; left: var(--margin); top: 598px; }
  .kicker { font-weight: 600; font-size: 22px; line-height: 1; letter-spacing: .32em; text-transform: uppercase; color: rgba(233, 238, 244, .82); white-space: nowrap; }
  .claim { margin-top: 22px; font-weight: 700; font-size: 104px; line-height: 1.02; letter-spacing: -.012em; white-space: nowrap; }

  #logo { position: absolute; left: 1560px; top: 186px; display: block; }
  #film { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #black { position: absolute; inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img alt=""><img alt=""><div id="grade"></div></div>

  <div class="beat">
    <div class="kicker"><span class="ln"><span>WPC-Sichtschutzzaun CALLADO</span></span></div>
    <div class="claim"><span class="ln"><span>Dein Zaun steht.</span></span></div>
  </div>
  <div class="beat">
    <div class="kicker"><span class="ln"><span>Passendes Zubehör</span></span></div>
    <div class="claim"><span class="ln"><span>Doch das Beste</span></span><span class="ln"><span>kommt noch …</span></span></div>
  </div>

  <img id="film" alt="">
  <div id="black"></div>
  <!-- Logo matte pulled from the film itself (scripts/logo_matte.py), so it sits exactly on the burned-in one. -->
  <img id="logo" alt="Home Deluxe">
</div>

<script src="composition.js"></script>
</body>
</html>
