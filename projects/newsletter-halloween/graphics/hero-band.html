<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hero-Band Halloween</title>
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../../assets/fonts/poppins/poppins-latin-400-normal.woff2); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../../assets/fonts/poppins/poppins-latin-600-normal.woff2); }

  /* gleiche Maße wie das Kopfband des KW43-Heros (1280 × 210) */

  .right span { display: block; font-weight: 400; color: #fff; }
  .thread { position: absolute; left: 905px; top: 0; width: 2px; height: 104px; background: linear-gradient(#ffffff00, #ffffff8c 40%); }
  .spider { position: absolute; left: 885px; top: 96px; }

</head>

<div id="canvas">

  </svg>
  <div class="right"><b>FINDE DEN CLOWN</b><span>&amp; sichere dir 50&nbsp;€</span></div>

</html>
