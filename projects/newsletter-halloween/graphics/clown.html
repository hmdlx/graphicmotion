<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Clown für das Suchspiel</title>
<!--
  Zwei Ebenen mit transparentem Hintergrund, groß gezeichnet und beim Einsetzen ins Foto
  verkleinert: der Kopf liegt hinter der Sofalehne (wird maskiert), die Handschuhe greifen
  vorne über die Kante.
-->
<style>
  body { margin: 0; background: transparent; }
  [data-out] { display: block; }
</style>
</head>
<body>
<svg data-out="clown-kopf" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="hair" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ff9a3c"/><stop offset=".55" stop-color="#ec5f1c"/><stop offset="1" stop-color="#b8380f"/>
    </radialGradient>
    <radialGradient id="face" cx=".45" cy=".38" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f3efe9"/><stop offset="1" stop-color="#d9d2c9"/>
    </radialGradient>
    <radialGradient id="nose" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ff8a80"/><stop offset=".35" stop-color="#e3261d"/><stop offset="1" stop-color="#9e1009"/>
    </radialGradient>
    <filter id="frizz" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="eye" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4e0da"/>
    </radialGradient>
  </defs>
  <!-- Haar: Locken rund um den Oberkopf und an den Seiten, Rand per Turbulenz kraus -->
  <g fill="url(#hair)" filter="url(#frizz)">
    <circle cx="96" cy="196" r="44"/><circle cx="304" cy="196" r="44"/>
    <circle cx="84" cy="150" r="40"/><circle cx="316" cy="150" r="40"/>
    <circle cx="104" cy="108" r="40"/><circle cx="296" cy="108" r="40"/>
    <circle cx="140" cy="82" r="40"/><circle cx="260" cy="82" r="40"/>
    <circle cx="182" cy="70" r="40"/><circle cx="222" cy="70" r="40"/>
    <circle cx="74" cy="236" r="34"/><circle cx="326" cy="236" r="34"/>
    <circle cx="200" cy="96" r="44"/>
  </g>
  <g fill="#c9440f" opacity=".35" filter="url(#frizz)">
    <circle cx="120" cy="120" r="14"/><circle cx="280" cy="128" r="12"/><circle cx="196" cy="62" r="11"/><circle cx="92" cy="200" r="13"/><circle cx="310" cy="190" r="12"/>
  </g>
  <!-- Gesicht -->
  <ellipse cx="200" cy="232" rx="94" ry="110" fill="url(#face)"/>
  <!-- Augenbrauen hoch gemalt -->
  <path d="M136 168 Q160 140 186 164" fill="none" stroke="#1d1d24" stroke-width="7" stroke-linecap="round"/>
  <path d="M214 164 Q240 140 264 168" fill="none" stroke="#1d1d24" stroke-width="7" stroke-linecap="round"/>
  <!-- Augen, Blick zur Seite -->
  <ellipse cx="163" cy="205" rx="19" ry="24" fill="url(#eye)" stroke="#1d1d24" stroke-width="3"/>
  <ellipse cx="237" cy="205" rx="19" ry="24" fill="url(#eye)" stroke="#1d1d24" stroke-width="3"/>
  <circle cx="156" cy="209" r="10" fill="#1d1d24"/><circle cx="230" cy="209" r="10" fill="#1d1d24"/>
  <circle cx="152" cy="205" r="3.4" fill="#fff"/><circle cx="226" cy="205" r="3.4" fill="#fff"/>
  <!-- Wangen -->
  <circle cx="134" cy="262" r="20" fill="#f08a8a" opacity=".35"/><circle cx="266" cy="262" r="20" fill="#f08a8a" opacity=".35"/>
  <!-- Mund (liegt meist hinter der Lehne) -->
  <path d="M138 286 Q200 352 262 286 Q200 318 138 286 Z" fill="#c8171a"/>
  <!-- Nase -->
  <circle cx="200" cy="250" r="27" fill="url(#nose)"/>
  <ellipse cx="191" cy="240" rx="8" ry="5" fill="#fff" opacity=".7"/>
</svg>

<svg data-out="clown-haende" width="400" height="160" viewBox="0 0 400 160">
  <defs>
    <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcd8d2"/>
    </linearGradient>
  </defs>
  <!-- je Hand vier Finger, die über die Kante nach vorn hängen; Kante liegt bei y = 40 -->
  <g id="hand" stroke="#a9a49c" stroke-width="2.5" fill="url(#glove)">
    <path d="M20 46 Q20 26 40 24 L104 24 Q124 26 124 46 Z"/>
    <rect x="22" y="34" width="24" height="62" rx="12"/>
    <rect x="46" y="34" width="25" height="72" rx="12.5"/>
    <rect x="71" y="34" width="25" height="70" rx="12.5"/>
    <rect x="96" y="34" width="24" height="58" rx="12"/>
  </g>
  <use href="#hand" transform="translate(256 0)"/>
</svg>
</body>
</html>
