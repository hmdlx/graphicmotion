<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Halloween-Übergänge zwischen den Newsletter-Abschnitten</title>
<!--
  Vier Übergänge, je 1280 px breit (640 px im Newsletter). Oben und unten haben sie exakt die
  Farbe des angrenzenden Abschnitts (Navy #0e2234 oder Weiß), damit die Kanten nahtlos sind.
    ueb-tropfen   Navy -> Weiß   Navy läuft in Tropfen nach unten aus
    ueb-nebel     Weiß -> Navy   Nebelschwaden steigen auf, Fledermäuse
    ueb-aeste     Navy -> Weiß   kahle Äste hängen herab, Spinne am Faden
    ueb-kuerbisse Weiß -> Navy   Hügel mit leuchtenden Kürbissen
  Die Formen werden mit festem Startwert zufällig erzeugt – bei jedem Rendern identisch.
-->
<style>
  body { margin: 0; background: #fff; }
  [data-out] { display: block; width: 1280px; background: #fff; }
</style>
</head>
<body>
<svg data-out="ueb-tropfen" width="1280" height="150" viewBox="0 0 1280 150"></svg>
<svg data-out="ueb-nebel" width="1280" height="190" viewBox="0 0 1280 190"></svg>
<svg data-out="ueb-aeste" width="1280" height="230" viewBox="0 0 1280 230"></svg>
<svg data-out="ueb-kuerbisse" width="1280" height="250" viewBox="0 0 1280 250"></svg>
<script>
  const NAVY = '#0e2234', ORANGE = '#ff9800';
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const el = (svg, tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
  const BAT = 'M48 14c2-4 4-6 4-9 2 3 1 6 3 7 6-6 16-10 26-10-4 3-6 7-5 11 5-2 11-1 15 3-5 0-9 2-11 6-5-3-11-3-15 2-3-4-6-5-9-4-2 2-4 6-8 11-4-5-6-9-8-11-3-1-6 0-9 4-4-5-10-5-15-2-2-4-6-6-11-6 4-4 10-5 15-3 1-4-1-8-5-11 10 0 20 4 26 10 2-1 1-4 3-7 0 3 2 5 4 9z';
  const bat = (svg, x, y, w, rot, color, op = 1) => el(svg, 'path', { d: BAT, fill: color, opacity: op, transform: `translate(${x} ${y}) rotate(${rot}) scale(${w / 96})` });

  // 1 Tropfen: Navy-Band oben, Tropfen mit Hals und runder Spitze
  (() => {
    const s = document.querySelector('[data-out="ueb-tropfen"]');
    el(s, 'rect', { x: 0, y: 0, width: 1280, height: 34, fill: NAVY });
    let x = -10;
    while (x < 1290) {
      const w = 18 + rnd() * 46, len = 14 + rnd() * rnd() * 110, r = w / 2;
      el(s, 'path', { fill: NAVY, d: `M${x - r * 0.9} 33 Q${x - r * 0.25} 33 ${x - r * 0.45} ${33 + len * 0.45} L${x - r} ${33 + len} A${r} ${r} 0 0 0 ${x + r} ${33 + len} L${x + r * 0.45} ${33 + len * 0.45} Q${x + r * 0.25} 33 ${x + r * 0.9} 33 Z` });
      if (rnd() < 0.25) el(s, 'circle', { cx: x + (rnd() - 0.5) * 8, cy: 33 + len + r + 10 + rnd() * 16, r: 3 + rnd() * 4, fill: NAVY });
      x += w * 0.9 + 6 + rnd() * 36;
    }
    // ein orangefarbener Tropfen als Akzent
    el(s, 'path', { fill: ORANGE, d: 'M1012 33 Q1016 33 1015 60 L1011 92 A10 10 0 0 0 1031 92 L1027 60 Q1026 33 1030 33 Z' });
  })();

  // 2 Nebel: Wellen mit steigender Deckkraft, unten volles Navy
  (() => {
    const s = document.querySelector('[data-out="ueb-nebel"]');
    const wave = (base, amp, len, phase, op) => {
      let d = `M0 ${base}`;
      for (let x = 0; x <= 1280; x += 16) d += ` L${x} ${base + Math.sin(x / len + phase) * amp + Math.sin(x / (len * 0.37) + phase * 2) * amp * 0.35}`;
      el(s, 'path', { d: d + ' L1280 190 L0 190 Z', fill: NAVY, opacity: op });
    };
    wave(70, 14, 120, 0.4, 0.12);
    wave(96, 12, 90, 2.1, 0.25);
    wave(122, 10, 140, 4.0, 0.5);
    wave(150, 9, 70, 1.3, 1);
    el(s, 'rect', { x: 0, y: 172, width: 1280, height: 18, fill: NAVY });
    bat(s, 180, 26, 54, -10, NAVY, 0.85); bat(s, 262, 10, 30, 12, NAVY, 0.7); bat(s, 1040, 38, 44, 8, NAVY, 0.8);
  })();

  // 3 Äste: Navy-Band oben, verzweigte kahle Äste hängen herab, Spinne am Faden
  (() => {
    const s = document.querySelector('[data-out="ueb-aeste"]');
    el(s, 'rect', { x: 0, y: 0, width: 1280, height: 26, fill: NAVY });
    const branch = (x, y, ang, len, w, depth) => {
      if (depth === 0 || len < 6) return;
      const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
      el(s, 'line', { x1: x, y1: y, x2, y2, stroke: NAVY, 'stroke-width': w, 'stroke-linecap': 'round' });
      const n = 2 + (rnd() < 0.3 ? 1 : 0);
      for (let i = 0; i < n; i++) branch(x2, y2, ang + (rnd() - 0.5) * 1.1, len * (0.62 + rnd() * 0.2), w * 0.66, depth - 1);
    };
    for (const [x, ang, len] of [[60, 1.35, 70], [250, 1.75, 62], [430, 1.45, 52], [700, 1.62, 58], [930, 1.3, 66], [1170, 1.8, 74]]) branch(x, 20, ang, len, 11, 6);
    el(s, 'line', { x1: 820, y1: 20, x2: 820, y2: 176, stroke: NAVY, 'stroke-width': 1.5 });
    el(s, 'ellipse', { cx: 820, cy: 192, rx: 10, ry: 13, fill: NAVY });
    el(s, 'circle', { cx: 820, cy: 175, r: 7, fill: NAVY });
    for (const sx of [-1, 1]) for (const [dy, dx, ey] of [[-2, 20, -12], [3, 23, 2], [8, 21, 16], [12, 16, 28]])
      el(s, 'path', { d: `M820 ${188 + dy} q${sx * dx * 0.6} -10 ${sx * dx} ${ey}`, stroke: NAVY, 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' });
    el(s, 'circle', { cx: 817, cy: 174, r: 1.8, fill: ORANGE }); el(s, 'circle', { cx: 823, cy: 174, r: 1.8, fill: ORANGE });
  })();

  // 4 Kürbisse: Hügel in Navy mit drei leuchtenden Kürbissen und Gras
  (() => {
    const s = document.querySelector('[data-out="ueb-kuerbisse"]');
    const defs = el(s, 'defs', {});
    const g = el(defs, 'radialGradient', { id: 'glow' });
    el(g, 'stop', { offset: 0, 'stop-color': ORANGE, 'stop-opacity': 0.45 }); el(g, 'stop', { offset: 1, 'stop-color': ORANGE, 'stop-opacity': 0 });
    let d = 'M0 190';
    for (let x = 0; x <= 1280; x += 20) d += ` L${x} ${178 - Math.sin(x / 210 + 0.6) * 26 - Math.sin(x / 77) * 6}`;
    el(s, 'path', { d: d + ' L1280 250 L0 250 Z', fill: NAVY });
    for (let x = 4; x < 1280; x += 7 + rnd() * 9) {
      const y = 178 - Math.sin(x / 210 + 0.6) * 26 - Math.sin(x / 77) * 6 + 3;
      el(s, 'path', { d: `M${x} ${y} q${(rnd() - 0.5) * 6} ${-6 - rnd() * 10} ${(rnd() - 0.5) * 10} ${-10 - rnd() * 14}`, stroke: NAVY, 'stroke-width': 2, fill: 'none' });
    }
    const pumpkin = (cx, base, size) => {
      el(s, 'circle', { cx, cy: base - size * 0.45, r: size * 1.3, fill: 'url(#glow)' });
      for (const [dx, rx] of [[-0.42, 0.5], [0.42, 0.5], [0, 0.52]]) el(s, 'ellipse', { cx: cx + dx * size, cy: base - size * 0.45, rx: rx * size, ry: size * 0.45, fill: NAVY });
      el(s, 'path', { d: `M${cx - 3} ${base - size * 0.86} q2 -14 12 -18`, stroke: NAVY, 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' });
      const e = size * 0.17;
      el(s, 'path', { fill: ORANGE, d: `M${cx - size * 0.38} ${base - size * 0.5} l${e} ${-e * 1.3} l${e} ${e * 1.3} Z` });
      el(s, 'path', { fill: ORANGE, d: `M${cx + size * 0.04} ${base - size * 0.5} l${e} ${-e * 1.3} l${e} ${e * 1.3} Z` });
      el(s, 'path', { fill: ORANGE, d: `M${cx - size * 0.42} ${base - size * 0.33} q${size * 0.42} ${size * 0.32} ${size * 0.84} 0 l${-size * 0.12} ${size * 0.05} l${-size * 0.08} ${-size * 0.06} l${-size * 0.1} ${size * 0.08} l${-size * 0.1} ${-size * 0.07} l${-size * 0.1} ${size * 0.08} l${-size * 0.1} ${-size * 0.07} l${-size * 0.12} ${size * 0.06} Z` });
    };
    pumpkin(210, 196, 64); pumpkin(310, 200, 40); pumpkin(1060, 190, 56);
    bat(s, 600, 40, 46, -6, NAVY, 0.9); bat(s, 680, 22, 28, 14, NAVY, 0.75);
  })();
</script>
</body>
</html>
