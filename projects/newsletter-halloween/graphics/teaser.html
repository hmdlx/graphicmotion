<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Suchspiel-Teaser Halloween</title>
<style>
  @font-face { font-family: Poppins; font-weight: 400; src: url(../../../assets/fonts/poppins/poppins-latin-400-normal.woff2); }
  @font-face { font-family: Poppins; font-weight: 500; src: url(../../../assets/fonts/poppins/poppins-latin-500-normal.woff2); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(../../../assets/fonts/poppins/poppins-latin-600-normal.woff2); }
  @font-face { font-family: Poppins; font-weight: 800; src: url(../../../assets/fonts/poppins/poppins-latin-800-normal.woff2); }
  /* CI: nur Navy, Weiß, Grautöne */
  :root { --navy: #0e2234; --navy-deep: #08141f; --grey: #c7d0d9; }
  body { margin: 0; background: #fff; }
  /* 1280 × 720, im Newsletter mit 640 px Breite eingebunden */
  [data-out] { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: Poppins, sans-serif;
            background: radial-gradient(130% 120% at 30% 40%, var(--navy) 35%, var(--navy-deep) 100%); }

  /* Taschenlampe: Lichtkegel von unten rechts auf den Gutschein */
  .beam { position: absolute; inset: 0;
          background: linear-gradient(200deg, #fff3dc00 30%, #fff3dc1f 62%, #fff3dc08 100%);
          clip-path: polygon(1280px 720px, 1180px 720px, 690px 120px, 1280px 30px); }
  .spot { position: absolute; left: 650px; top: 70px; width: 640px; height: 580px; border-radius: 50%;
          background: radial-gradient(closest-side, #fff3dc2e, #fff3dc12 60%, #fff3dc00); }

  .label { position: absolute; left: 72px; top: 92px; font-weight: 600; font-size: 22px; letter-spacing: 5px; color: var(--grey); }
  .h1 { position: absolute; left: 68px; top: 132px; margin: 0; font-weight: 800; color: #fff; line-height: .98; }
  .h1 .a { display: block; font-size: 92px; letter-spacing: -.5px; }
  .h1 .b { display: block; font-size: 150px; letter-spacing: -2px; }
  .sub { position: absolute; left: 72px; top: 470px; width: 600px; font-weight: 400; font-size: 27px; line-height: 40px; color: #ffffffd9; }
  .sub strong { font-weight: 600; color: #fff; }
  .rule { position: absolute; left: 72px; top: 446px; width: 64px; height: 4px; background: #fff; }

  /* Gutschein mit Stanzungen links und rechts */
  .ticket { position: absolute; left: 790px; top: 150px; width: 420px; height: 420px; background: #fff; color: var(--navy);
            text-align: center; transform: rotate(-4deg);
            -webkit-mask: radial-gradient(circle 26px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat,
                          radial-gradient(circle 26px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
  .ticket .in { position: absolute; inset: 18px; border: 2px dashed #0e223480; }
  .ticket .k { margin-top: 62px; font-weight: 600; font-size: 22px; letter-spacing: 6px; }
  .ticket .v { margin-top: 2px; font-weight: 800; font-size: 146px; line-height: 1.05; letter-spacing: -3px; }
  .ticket .c { margin-top: 6px; font-weight: 600; font-size: 25px; }
  .ticket .d { margin: 18px auto 0; width: 300px; padding-top: 16px; border-top: 2px solid #0e22344d; font-weight: 500; font-size: 20px; }

  .bat { position: absolute; fill: #ffffff; }
</style>
</head>
<body>
<div data-out="teaser">
  <div class="beam"></div>
  <div class="spot"></div>

  <svg class="bat" style="left:560px;top:48px;opacity:.18" width="96" height="40" viewBox="0 0 96 40"><path d="M48 14c2-4 4-6 4-9 2 3 1 6 3 7 6-6 16-10 26-10-4 3-6 7-5 11 5-2 11-1 15 3-5 0-9 2-11 6-5-3-11-3-15 2-3-4-6-5-9-4-2 2-4 6-8 11-4-5-6-9-8-11-3-1-6 0-9 4-4-5-10-5-15-2-2-4-6-6-11-6 4-4 10-5 15-3 1-4-1-8-5-11 10 0 20 4 26 10 2-1 1-4 3-7 0 3 2 5 4 9z"/></svg>
  <svg class="bat" style="left:690px;top:610px;opacity:.12" width="64" height="27" viewBox="0 0 96 40"><path d="M48 14c2-4 4-6 4-9 2 3 1 6 3 7 6-6 16-10 26-10-4 3-6 7-5 11 5-2 11-1 15 3-5 0-9 2-11 6-5-3-11-3-15 2-3-4-6-5-9-4-2 2-4 6-8 11-4-5-6-9-8-11-3-1-6 0-9 4-4-5-10-5-15-2-2-4-6-6-11-6 4-4 10-5 15-3 1-4-1-8-5-11 10 0 20 4 26 10 2-1 1-4 3-7 0 3 2 5 4 9z"/></svg>
  <svg class="bat" style="left:1150px;top:40px;opacity:.14" width="70" height="29" viewBox="0 0 96 40"><path d="M48 14c2-4 4-6 4-9 2 3 1 6 3 7 6-6 16-10 26-10-4 3-6 7-5 11 5-2 11-1 15 3-5 0-9 2-11 6-5-3-11-3-15 2-3-4-6-5-9-4-2 2-4 6-8 11-4-5-6-9-8-11-3-1-6 0-9 4-4-5-10-5-15-2-2-4-6-6-11-6 4-4 10-5 15-3 1-4-1-8-5-11 10 0 20 4 26 10 2-1 1-4 3-7 0 3 2 5 4 9z"/></svg>

  <div class="label">HALLOWEEN-SUCHSPIEL</div>
  <h1 class="h1"><span class="a">FINDE DEN</span><span class="b">CLOWN</span></h1>
  <div class="rule"></div>
  <div class="sub">Hast du ihn oben schon entdeckt? <strong>Klick auf den Clown</strong> – und wir schenken dir den Gutschein.</div>

  <div class="ticket">
    <div class="in"></div>
    <div class="k">GUTSCHEIN</div>
    <div class="v">50&nbsp;€</div>
    <div class="c">ab 500&nbsp;€ Bestellwert</div>
    <div class="d">nur bis 02.11.2026</div>
  </div>
</div>
</body>
</html>
